name: Cypress tests
on: [push, pull_request]
jobs:
  cypress-run:
    name: Cypress run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cypress Cloud distributes each project's specs across these machines.
        machines: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Enable corepack (Yarn version from package.json)
        run: corepack enable
      - name: Cache node_modules and Cypress binary
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-node22-yarn-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install Cypress binary
        id: install-cypress
        run: yarn cypress install
      # Both packages always run (there is no "affected" filtering without nx).
      # Each is its own Cypress Cloud project, and --parallel splits its specs across the machines.
      # TODO: these record keys used to be committed in project.json; move them to repository
      # secrets (e.g. ${{ secrets.CYPRESS_RECORD_KEY_OVE }}) and rotate them.
      - name: e2e ove
        run: yarn workspace @opencloning/tg-oss-ove e2e
        env:
          CYPRESS_RECORD_KEY: 373658d4-4931-4ffd-9263-8eb78a838ab9
      - name: e2e ui
        if: ${{ !cancelled() && steps.install-cypress.outcome == 'success' }}
        run: yarn workspace @opencloning/tg-oss-ui e2e
        env:
          CYPRESS_RECORD_KEY: 1ced39be-1a3a-4fd8-b2d5-a88951d9b766
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.machines }}
          path: packages/*/cypress/screenshots
          if-no-files-found: ignore
