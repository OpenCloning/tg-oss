name: Cypress tests
on: [push, pull_request]
jobs:
  cypress-run:
    name: Cypress run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the actual items in the array do not matter,
        # just the number - to force CI to sping 3 copies
        # of the current job in parallel
        machines: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Checkout
        uses: actions/checkout@v3
      - name: Enable corepack (Yarn 4)
        run: npm install -g corepack@latest && corepack enable
      - name: Install dependencies
        uses: cypress-io/github-action@v6
        with:
          # just perform install
          runTests: false
      # Both packages always run (there is no "affected" filtering without nx).
      # Each is its own Cypress Cloud project, and --parallel splits its specs across the machines.
      # TODO: these record keys used to be committed in project.json; move them to repository
      # secrets (e.g. ${{ secrets.CYPRESS_RECORD_KEY_OVE }}) and rotate them.
      - name: e2e ove
        run: yarn workspace @opencloning/tg-oss-ove e2e
        env:
          CYPRESS_RECORD_KEY: 373658d4-4931-4ffd-9263-8eb78a838ab9
      - name: e2e ui
        if: success() || failure()
        run: yarn workspace @opencloning/tg-oss-ui e2e
        env:
          CYPRESS_RECORD_KEY: 1ced39be-1a3a-4fd8-b2d5-a88951d9b766
